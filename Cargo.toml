[package]
name = "hakimi-pet"
version = "1.4.1"
license = "MIT"
repository = "https://github.com/bilili-syy/hakimi-pet-rs"
edition = "2024"

[dependencies]
base64 = "0.23.1"
crc32fast = "1.5.5"
fastrand = "2.5.0"
flate2 = "1.1.11"
include_dir = "0.7.4"
rodio = "0.23.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1_smol = "1.0.1"
tiny-skia = "0.12.0"
tray-icon = "0.26.1"
ureq = { version = "3.5.2", features = ["json"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_Globalization", "Win32_System_SystemInformation", "Win32_UI_HiDpi", "Win32_UI_Controls", "Win32_System_SystemServices", "Win32_Security", "Win32_System_StationsAndDesktops", "Win32_System_Power", "Win32_System_ApplicationInstallationAndServicing", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Diagnostics_ToolHelp", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Time"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

